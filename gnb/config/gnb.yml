# OCUDU gNB with MBS broadcast, USRP B210, band n78 TDD 20 MHz (3489.42 MHz), PLMN 999/70.
# Mounted into the container at /config/gnb.yml by ../start.sh. Logs and pcaps go to gnb/logs/.
# Spectrum: n78 over the air needs a licence or a shielded / cabled setup.
gnb_id: 1

cu_cp:
  amf:
    addrs: 127.0.0.1
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
                sd: 16777215
  inactivity_timer: 7200
  request_pdu_session_timeout: 30

cu_up:
  ngu:
    socket:
      - bind_addr: 10.33.33.1
        ext_addr: 10.33.33.1

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=512,num_send_frames=512
  srate: 23.04
  otw_format: sc12
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "99970"
  tac: 1
  pci: 1
  slicing:
    - sst: 1
      sd: 16777215
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 13
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pucch:
    f1_enable_occ: false
    f1_nof_cyclic_shifts: 1
    resource_set_size: 4
    nof_cell_res_set_configs: 1
    nof_cell_sr_res: 2
    nof_cell_csi_res: 2
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
  sib:
    si_window_length: 40
    si_sched_info:
      - si_period: 64
        sib_mapping: 2
      - si_period: 64
        sib_mapping: 20
        si_window_position: 2
    sib2:
      q_hyst: 3
      thresh_serving_low_p: 0
      cell_reselection_priority: 6
      q_rx_lev_min: -70
      s_intra_search_p: 62
      t_reselection_nr: 1

log:
  filename: /logs/gnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: true
  mac_filename: /logs/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /logs/gnb_ngap.pcap

metrics:
  autostart_stdout_metrics: true   # print the per-UE table every second (no need to type "t")
  enable_json: false
  enable_log: true                 # also write metrics (incl. radio Late/Underflow/Overflow) to the gNB log
  layers:
    enable_ru: true                # radio (B210) late/underflow/overflow counters, printed whenever non-zero

remote_control:
  bind_addr: 127.0.0.1
  enabled: true
