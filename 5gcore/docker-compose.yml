# 5G core with MBS (5G-MAG reference tools, Open5GS based) + AF/AS media sender.
# Images are pinned to the exact digests tested with the MBS gNB (Oct 2026), so every install is identical.
# Start with ./start.sh (it also creates the media file and the test subscriber).

x-nf: &nf
  restart: unless-stopped

services:
  db:
    <<: *nf
    container_name: db
    image: mongo@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac   # mongo:6.0
    command: "mongod --bind_ip 0.0.0.0 --port 27017"
    networks: {5g-mag: {ipv4_address: 10.33.33.2, aliases: [db.5g-mag.org]}}
    volumes: [db_data:/data/db, db_config:/data/configdb]

  nrf:
    <<: *nf
    container_name: nrf
    image: ghcr.io/5g-mag/nrf@sha256:35933c782d349e8410559815e635da1eaad1dbd881faaf80facf6ebab1765f7b
    command: "-c /etc/open5gs/custom/nrf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.4, aliases: [nrf.5g-mag.org]}}
    configs: [{source: nrf_config, target: /etc/open5gs/custom/nrf.yaml}]

  ausf:
    <<: *nf
    container_name: ausf
    image: ghcr.io/5g-mag/ausf@sha256:8778c15085a3d0e0843bef3c28ead711acc7d603d2f911f71ee36b0782803f8a
    command: "-c /etc/open5gs/custom/ausf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.5, aliases: [ausf.5g-mag.org]}}
    configs: [{source: ausf_config, target: /etc/open5gs/custom/ausf.yaml}]
    depends_on: [nrf]

  udm:
    <<: *nf
    container_name: udm
    image: ghcr.io/5g-mag/udm@sha256:245f7351dcb6171c34890c5cee72118dbb5a25456ab494bd8ca483a5a6f72cc6
    command: "-c /etc/open5gs/custom/udm.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.6, aliases: [udm.5g-mag.org]}}
    configs: [{source: udm_config, target: /etc/open5gs/custom/udm.yaml}]
    depends_on: [nrf]

  udr:
    <<: *nf
    container_name: udr
    image: ghcr.io/5g-mag/udr@sha256:9310af0751398659a39c6a30aa9e91617fa943ffcd89db53f7f61855b31b279e
    command: "-c /etc/open5gs/custom/udr.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.7, aliases: [udr.5g-mag.org]}}
    configs: [{source: udr_config, target: /etc/open5gs/custom/udr.yaml}]
    depends_on: [db, nrf]

  nssf:
    <<: *nf
    container_name: nssf
    image: ghcr.io/5g-mag/nssf@sha256:96e38153607836fc33b17a69e73146250c03ab8e82018462dc3bb79a647e5e25
    command: "-c /etc/open5gs/custom/nssf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.8, aliases: [nssf.5g-mag.org]}}
    configs: [{source: nssf_config, target: /etc/open5gs/custom/nssf.yaml}]
    depends_on: [nrf]

  bsf:
    <<: *nf
    container_name: bsf
    image: ghcr.io/5g-mag/bsf@sha256:5be73dcb1e198623d98c84ba167991b2423462bbee9e4deabe615b2080993425
    command: "-c /open5gs/config/bsf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.21, aliases: [bsf.5g-mag.org]}}
    configs: [{source: bsf_config, target: /open5gs/config/bsf.yaml}]
    depends_on: [nrf]

  pcf:
    <<: *nf
    container_name: pcf
    image: ghcr.io/5g-mag/pcf@sha256:4ffe1d0f63290fcab1887f5a48ffb51073b334ec340e68538359db106607babe
    command: "-c /etc/open5gs/custom/pcf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.20, aliases: [pcf.5g-mag.org]}}
    configs: [{source: pcf_config, target: /etc/open5gs/custom/pcf.yaml}]
    depends_on: [db, nrf]

  webui:
    <<: *nf
    container_name: webui
    image: ghcr.io/5g-mag/webui@sha256:e121805aa4580e6bac2f2a2d7625efcc909f81116d69b7f0e7dae29ca269111a
    environment: [DB_URI=mongodb://db.5g-mag.org/open5gs, PORT=9999, HOSTNAME=0.0.0.0, NODE_ENV=dev]
    command: "run dev"
    networks: {5g-mag: {ipv4_address: 10.33.33.9, aliases: [webui.5g-mag.org]}}
    ports: ["127.0.0.1:9999:9999/tcp"]      # subscriber web UI; change to 0.0.0.0 to reach it from the LAN
    depends_on: [db]

  amf_with_mbs:
    <<: *nf
    container_name: amf_with_mbs
    image: ghcr.io/5g-mag/amf_with_mbs@sha256:3c69f4ce3077f7f523d4c6ba4027f6eeecf2fa8f4272c4cd05251401d7197b0d
    command: "-c /etc/open5gs/custom/amf_with_mbs.yaml"
    ports: ["127.0.0.1:38412:38412/sctp"]   # NGAP: the gNB container (host network) connects here
    networks: {5g-mag: {ipv4_address: 10.33.33.19, aliases: [amf-with-mbs.5g-mag.org]}}
    configs: [{source: amf_with_mbs_config, target: /etc/open5gs/custom/amf_with_mbs.yaml}]
    depends_on: [nrf]

  smf_mb-smf:
    <<: *nf
    container_name: smf_mb-smf
    image: ghcr.io/5g-mag/smf_mb-smf@sha256:ab89c48927350e275bc34c0dc7e1e5527b21365f653b2a29fc6afac1cd4b0676
    command: "-c /etc/open5gs/custom/smf_mb-smf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.18, aliases: [smf-mb-smf.5g-mag.org]}}
    configs: [{source: smf_mb-smf_config, target: /etc/open5gs/custom/smf_mb-smf.yaml}]
    depends_on: [nrf, upf_mb-upf]

  upf_mb-upf:
    <<: *nf
    container_name: upf_mb-upf
    image: ghcr.io/5g-mag/upf_mb-upf@sha256:195e3fd143889bc999751dd839dde45920f21c10599ca1c6b164da9cd0f3e309
    command: "-c /etc/open5gs/custom/upf_mb-upf.yaml"
    networks: {5g-mag: {ipv4_address: 10.33.33.3, aliases: [upf-mb-upf.5g-mag.org]}}
    configs: [{source: upf_mb-upf_config, target: /etc/open5gs/custom/upf_mb-upf.yaml}]
    privileged: true
    cap_add: [NET_ADMIN]

  test_mbs_af_as:
    <<: *nf
    container_name: test_mbs_af_as
    image: ghcr.io/5g-mag/test_mbs_af_as@sha256:004ba6d44ff306a1517a24a3fb2030c19b2e5628f632becc54bfb97a029dff0b
    networks: {5g-mag: {ipv4_address: 10.33.33.10, aliases: [test-mbs-af-as.5g-mag.org]}}
    volumes:
      - ./af-as:/test:ro          # 5G-MAG MBS API tests + our TMGI/session helpers and media senders
      - ./media:/test/media       # demo.ts is generated here by make-demo-media.sh
    cap_add: [NET_ADMIN]

networks:
  5g-mag:
    name: 5g-mag
    driver: bridge
    driver_opts: {com.docker.network.bridge.name: br-5g-mag}   # the gNB binds NG-U to 10.33.33.1 on this bridge
    ipam: {config: [{subnet: 10.33.33.0/24}]}

volumes:
  db_data: {name: open5gs_db_data}
  db_config: {name: open5gs_db_config}

configs:
  nrf_config: {file: ./configs/nrf.yaml}
  ausf_config: {file: ./configs/ausf.yaml}
  udm_config: {file: ./configs/udm.yaml}
  udr_config: {file: ./configs/udr.yaml}
  nssf_config: {file: ./configs/nssf.yaml}
  bsf_config: {file: ./configs/bsf.yaml}
  pcf_config: {file: ./configs/pcf.yaml}
  amf_with_mbs_config: {file: ./configs/amf_with_mbs.yaml}
  smf_mb-smf_config: {file: ./configs/smf_mb-smf.yaml}
  upf_mb-upf_config: {file: ./configs/upf_mb-upf.yaml}
